      #
      #  ✅ Story 1.6 đóng luật thứ hai ngoài danh sách — `check CommandRegistry and
      #  keyboard focus` (AD-34 · FR22 · NFR17), cùng cụm với ba bước trên vì cùng hình
      #  dạng: chỉ đọc tệp, không cần `dist/`, không cần webview. Trong đó **Kiểm D** là
      #  phép kiểm duy nhất của dự án lái cả hai nhánh `Mod → ⌘ | Ctrl`; nó chạy được
      #  trên MỘT nền tảng vì nền tảng là một tham số tiêm vào, không phải một lời gọi
      #  `navigator` — nên nó vẫn canh được người dùng Windows kể cả ở lượt chạy macOS.
      #
      #  Đặt bước mới ngay dưới khối này. Chúng chạy trên CẢ HAI nền tảng của matrix mà
      #  không phải khai gì thêm — đó là lý do job được viết thành một job có matrix chứ
      #  không phải hai job song song.
      # ══════════════════════════════════════════════════════════════════════════════
