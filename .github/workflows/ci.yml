# AuraTranslate — CI tối thiểu. Story 1.3 (Epic 1). NFR14 · NFR15 · NFR6 (nửa Windows).
#
# ══════════════════════════════════════════════════════════════════════════════════
#  ĐÂY KHÔNG PHẢI FR107.
#
#  Không build công khai kiểm chứng được, không checksum SHA-256, không đụng
#  `dict-manifest.toml`, không GitHub Release. FR107 đóng ở **Story 10.1** với phạm vi
#  nguyên vẹn. Nếu bạn tới đây để thêm một bước phát hành — dừng lại, đó là story khác.
# ══════════════════════════════════════════════════════════════════════════════════
#
#  MỘT PIPELINE DUY NHẤT. AC4 của Story 1.3 cấm tường minh việc dựng tệp workflow
#  thứ hai. Từ đây tới Epic 10 (chín epic, ~127 story), MỌI luật cưỡng chế bằng test
#  đều gắn vào chính tệp này — xem khối "CHỖ MÓC CHO EPIC SAU" ở cuối job `check`.
#
#  Phiên bản action kiểm chứng qua GitHub API ngày 2026-08-03:
#    actions/checkout v7.0.1 · actions/setup-node v7.0.0 · Swatinem/rust-cache v2.9.1
#  Toolchain ghim `1.97.1` — đúng số máy Ice đang chạy, để hai nền tảng CI và máy dev
#  cùng một toolchain. `@stable` sẽ trôi (hôm nay là 1.100.0) và làm số đo AC6 hết so
#  sánh được.

name: CI

on:
  # ⚠️ MỌI nhánh. Nhánh mặc định của repo này là `master`, KHÔNG phải `main` — viết cứng
  # `branches: [main]` thì CI không bao giờ chạy và KHÔNG lỗi nào được ném.
  push:
  pull_request:

# Không `paths`/`paths-ignore`. AC1 nói "một commit BẤT KỲ". Lọc đường dẫn là đúng chỗ
# một thay đổi thật lọt qua vì nó nằm chung commit với một tệp `.md`.

concurrency:
  # Đòn bẩy rẻ nhất cho AC7 và cho §Ngân sách CI: push liên tiếp thì huỷ lượt cũ.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Tối thiểu. Story này không ghi gì lên repo (AC5 — không phát hành).
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      # ⚠️ AC1 — "kết quả hai nền tảng hiện TÁCH BẠCH, không gộp". Một nền tảng đỏ KHÔNG
      # được huỷ nền tảng kia; gộp lại là mất đúng thứ AC1 đòi.
      fail-fast: false
      matrix:
        # Ghim ảnh, không dùng `-latest`: story này ghi số dung lượng ở MỖI lần chạy
        # (AC6), nên ảnh runner đổi dưới chân là một hồi quy giả.
        # ⚠️ `macos-26` là arm64 (Apple Silicon). Story 1.1/1.2 đo trên Intel x86_64 —
        # số `.dmg` ở đây KHÔNG so được với `22.944.022 byte` của Story 1.1.
        os: [macos-26, windows-2025]
    runs-on: ${{ matrix.os }}

    # Lưới an toàn cho AC7 và cho §Ngân sách CI: repo là PRIVATE, macOS tính hệ số ×10.
    # Mặc định của GitHub là 360 phút — một job treo trên macOS tiêu 3.600 phút hạn mức
    # trước khi ai kịp nhận ra. Treo phải là một lỗi tường minh, không phải một hoá đơn.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Máy Ice v22.22.2; Vite 8 đòi `^20.19.0 || >=22.12.0`.
          node-version: '22'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@1.97.1

      # ⚠️ BẮT BUỘC, không phải tối ưu (AC7). Cache lạnh phải biên dịch `aws-lc-sys`,
      # `libsqlite3-sys` (SQLite từ nguồn C) và `zstd-sys`. Không có bước này thì AC7
      # chết ngay lượt thứ hai.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ⚠️ `npm ci`, KHÔNG `npm install`. Đây là hình dạng cưỡng chế được của NFR15:
      # không phụ thuộc nào vào được cây mà không hiện thành diff lockfile trong commit,
      # nên lượt rà giấy phép của Story 1.2 Task 7 luôn có chỗ bám.
      - name: npm ci
        run: npm ci

      # 13 phép kiểm — cây phụ thuộc (AC2/AC5 của Story 1.2). Chạy trên CẢ HAI nền tảng:
      # script có ngưỡng sàn (Rust ≥ 200, npm ≥ 30) nên cây rỗng không đọc thành "sạch".
      # Số thật: macOS 343 crate, Windows ~346. Chạm sàn = lỗi quét, không phải đạt.
      #
      # Không thêm `cargo-deny` / `cargo-audit` / `license-checker`. Chúng nằm ngoài
      # bảng Stack, và NFR15 đòi ĐỌC TỆP GIẤY PHÉP trong nguồn đã tải — đúng thứ một bộ
      # nhận dạng tự động làm sai (`tantivy-stemmers` suýt bị chấm sai BSD-2 ở Story 1.2).
      - name: check dependency tree (NFR15, AC2/AC5 của Story 1.2)
        run: npm run check:deps

      # Hai cổng `tools/dict-build` — AC2/AC4 của Story 1.9. Đặt KỀ `check:deps` vì
      # cùng họ: cả hai đọc cây phụ thuộc/mã nguồn tĩnh, xong trong vài giây, không cần
      # `dist/`. Không đọc `.db`, không tải gì — AC cuối của Story 1.3 vẫn đúng
      # nguyên: CI không tải dữ liệu từ điển.
      - name: check tools/dict-build isolation and merge vocabulary (AC2, AC4 — Story 1.9)
        run: npm run check:dict

      - name: check dict-manifest.toml shape (AC3 — Story 1.9)
        run: npm run check:dict-manifest

      # Bảy phép kiểm token — AD-34 · NFR17 (Story 1.4). Đây chính là chỗ móc mang tên
      # "lint cấm màu viết thẳng (AD-34)" mà AC4 của Story 1.3 đã chừa sẵn: MỘT bước
      # trong job `check` đã có, KHÔNG phải một tệp workflow thứ hai.
      #
      # ⚠️ ĐẶT TRƯỚC `npm run build`, có lý do đo được: bước này chạy trong vài giây và
      # không cần `dist/`, nên một token sai phải đỏ TRƯỚC khi tốn một lượt biên dịch
      # Rust. Trên nhánh Windows lượt đó là hàng chục phút.
      #
      # ⚠️ Bước này KHÔNG cần cửa sổ đồ hoạ — nó chỉ đọc tệp. Đừng đẩy nó xuống cụm cuối
      # nơi `check:scope` và `check:scope:bundled` đang đứng chờ webview.
      - name: check design tokens (AD-34, NFR17 — Story 1.4)
        run: npm run check:tokens

      # Năm phép kiểm chuỗi giao diện — NFR16 · AD-21 (Story 1.5). Đóng mục
      # `deferred-work.md:19` (*"NFR16 không có cơ chế cưỡng chế nào"*).
      #
      # Kề bước token vì cùng hình dạng và cùng lý do đặt chỗ: chỉ đọc tệp, xong trong
      # vài giây, không cần `dist/`, không cần cửa sổ đồ hoạ. Một chuỗi tiếng Việt lọt
      # vào `.vue` phải đỏ TRƯỚC khi tốn một lượt biên dịch Rust.
      #
      # ⚠️ Kiểm E của bước này `import()` thẳng `src/i18n/resolve.ts` — nó dựa vào việc
      # Node ≥ 22.18 bóc kiểu TypeScript mặc định. `node-version` của job đang là '22';
      # hạ số đó xuống là làm phép kiểm hành vi AC4 `abort()` với exit 1, không phải im
      # lặng bỏ qua.
      - name: check UI strings and IPC error shape (NFR16, AD-21 — Story 1.5)
        run: npm run check:i18n

      # Năm phép kiểm CommandRegistry — AD-34 · FR22 · NFR17 (Story 1.6). Cổng thứ tư,
      # cùng khuôn và cùng lý do đặt chỗ với ba bước ngay trên: chỉ đọc tệp, xong trong
      # vài giây, không cần `dist/`, không cần phiên đồ hoạ. Một `@click` tự cài đặt thao
      # tác tại chỗ phải đỏ TRƯỚC khi tốn một lượt biên dịch Rust.
      #
      # Đừng đẩy bước này xuống cụm cuối nơi `check:scope` / `check:scope:bundled` đứng
      # — hai bước đó chờ webview, bước này thì không.
      #
      # 🔴 Kiểm D là phép kiểm DUY NHẤT trong dự án đứng giữa `⌘1` và người dùng Windows:
      # nó nạp `src/commands/keys.ts` rồi lái CẢ HAI ca `isMac`. Một cài đặt chỉ đọc
      # `event.metaKey` đi qua cả hai nhánh của ma trận này (không có test nào chạm tầng
      # bàn phím) rồi hỏng ở tay người dùng — vi phạm NFR14 nặng nhất còn lọt được.
      #
      # ⚠️ Kiểm C/D/E `import()` thẳng `src/commands/*.ts` — chúng dựa vào việc Node ≥ 22.18
      # bóc kiểu TypeScript mặc định, đúng đường mà Kiểm E của `check:i18n` đã chạy thật từ
      # Story 1.5. `node-version` của job đang là '22'; hạ số đó xuống là làm ba phép kiểm
      # hành vi `abort()` với exit 1, không phải im lặng bỏ qua.
      - name: check CommandRegistry and keyboard focus (AD-34, FR22, NFR17 — Story 1.6)
        run: npm run check:commands

      # Bốn phép kiểm bố cục — AC1 · AC4 · AC7 · AC12 (Story 1.14). Cổng thứ năm, cùng
      # khuôn và cùng lý do đặt chỗ với ba bước ngay trên: chỉ đọc/chạy mã thuần, xong
      # trong vài giây, không cần `dist/`, không cần phiên đồ hoạ. Một `addPopoutGroup`
      # hay một `localStorage` lọt vào `src/**` phải đỏ TRƯỚC khi tốn một lượt biên dịch
      # Rust — đúng thứ AC12 đòi ("Sáu cổng phải xanh").
      - name: check workspace layout (AC1, AC4, AC7, AC12 — Story 1.14)
        run: npm run check:layout

      # Cổng thứ MƯỜI — lint có kiểu (`01be1c2`, lượt code review Story 1.21). Nó đóng
      # đúng lớp lỗi mà chín cổng kia không canh được: `if (someRef)` trên một `Ref` của
      # Vue là TypeScript hợp lệ, `vue-tsc` im, và nhánh bên trong thành mã chết. Hai
      # trong bốn phát hiện hạng cao của lượt review đó là đúng hình dạng này.
      #
      # 🔴 Bước này THIẾU khỏi pipeline từ lúc cổng ra đời (2026-08-11) tới lượt rà soát
      # toàn Epic 1 cùng ngày: cổng sống trong `package.json` nhưng CI không gọi, nên nó
      # canh máy dev và KHÔNG canh nhánh. Đó là đúng lớp hỏng-im-lặng mà AC3 của story
      # này tồn tại để chặn.
      #
      # ⚠️ `eslint` chạy có kiểu (`projectService`), nên nó cần `node_modules` — đã có từ
      # `npm ci` — nhưng KHÔNG cần `dist/`. Giữ nó ở cụm đọc-tệp này, đừng đẩy xuống sau
      # `npm run build`.
      - name: check lint có kiểu (cổng thứ mười — lượt review Story 1.21)
        run: npm run check:lint

      # Cổng thứ MƯỜI MỘT — hai danh sách cổng phải khai cùng một bộ. Nó tồn tại vì cổng
      # thứ mười ở ngay trên đã sống ba mươi tiếng trong `package.json` mà `ci.yml` không
      # gọi, và không phép kiểm nào biết. Kho có HAI danh sách cổng; đây là thứ buộc chúng
      # khớp.
      #
      # ⚠️ Nó đọc chính tệp này. Thêm một `check:*` vào `package.json` mà quên thêm một
      # bước ở đây ⇒ bước này ĐỎ, ở cổng chứ không ở một lượt rà soát epic sáu ngày sau.
      - name: check hai danh sách cổng khớp nhau (cổng thứ mười một)
        run: npm run check:gates

      # ⚠️⚠️ THỨ TỰ BẮT BUỘC — bước này PHẢI đứng TRƯỚC `cargo test`.
      # `tauri::generate_context!` nhúng `frontendDist: "../dist"` LÚC BIÊN DỊCH. `dist/`
      # chưa tồn tại thì `cargo test` gãy ở khâu biên dịch, không ở một assert. Trên máy
      # dev bẫy này vô hình vì `dist/` còn lại từ lượt build trước; trên runner sạch nó
      # là lỗi đầu tiên.
      - name: npm run build (PHẢI trước cargo test)
        run: npm run build

      # ⚠️ Không `--all-features`, và không `--release`: profile release có
      # `lto = true` + `codegen-units = 1`, biên dịch lâu gấp nhiều lần mà không kiểm
      # thêm được gì. `--locked` là nửa Rust của NFR15.
      - name: cargo test
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      # ── Bản build ứng dụng THẬT (AC1, AC3) ──────────────────────────────────────
      #
      # ⚠️ Truyền `--bundles` TƯỜNG MINH. `tauri.conf.json` khai `targets: ["dmg","msi"]`,
      # và `tauri-cli` 2.11.4 trên macOS TỪ CHỐI giá trị `msi`:
      #   `error: invalid value 'msi' for '--bundles'  [possible values: ios, app, dmg]`
      # (đo lại 2026-08-03 qua `npx tauri build --help`). Để `tauri build` trần đọc
      # `bundle.targets` là cược vào một hành vi lọc chưa ai đo — AC1 không đáng cược.
      #
      # `CI=true` GitHub Actions đặt sẵn (xác nhận: `--ci` khai `[env: CI=]`). Trên macOS
      # nó tránh bẫy #1 của Story 1.1 — `bundle_dmg.sh` chết ở bước AppleScript.

      - name: tauri build (macOS — .dmg)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          START=$(date +%s)
          npx tauri build --bundles dmg
          ELAPSED=$(( $(date +%s) - START ))

          # ⚠️ Glob, không `ls | head`: dưới `set -o pipefail` một `head` đóng ống sớm
          # làm cả pipeline trả khác 0, và bước sẽ đỏ vì một lý do không liên quan.
          shopt -s nullglob
          DMGS=(src-tauri/target/release/bundle/dmg/*.dmg)
          if [ ${#DMGS[@]} -eq 0 ]; then
            echo "Không tìm thấy .dmg sau khi build — đây là lỗi, không phải 'không có gì để đo'." >&2
            exit 1
          fi
          DMG="${DMGS[0]}"
          BYTES=$(stat -f%z "$DMG")
          ARCH=$(uname -m)
          # ⚠️ Hoist ra biến, đừng gọi `$(…)` thẳng trong `echo`: `echo` luôn thành công
          # nên `set -e` KHÔNG bắt được lệnh con gãy, và ta chỉ còn một ô rỗng trong bảng
          # — số đo biến mất mà bước vẫn xanh. Đã vấp thật lúc chạy khô 2026-08-03.
          RUSTC_V=$(rustc --version)
          TAURI_V=$(npx tauri --version)
          # ⚠️ Hoist thôi CHƯA đủ. `set -e` bắt được mã thoát khác 0, nhưng một lệnh
          # thoát 0 mà in ra chuỗi RỖNG (npx bị chặn đầu ra, wrapper in sang stderr) thì
          # nó không thấy — và ta lại còn đúng một ô trống trong bảng với bước vẫn xanh.
          # Bên PowerShell đã có `throw` cho ca này từ đầu; bên bash thì chưa. Nay có.
          if [ -z "$RUSTC_V" ] || [ -z "$TAURI_V" ]; then
            echo "không đọc được phiên bản toolchain (rustc='$RUSTC_V' tauri='$TAURI_V') — số đo không truy nguyên được thì không phải số đo" >&2
            exit 1
          fi

          {
            echo "### macOS — bản build ứng dụng"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| runner | \`${{ matrix.os }}\` |"
            echo "| kiến trúc | **$ARCH** |"
            echo "| \`.dmg\` | **$BYTES byte** |"
            echo "| thời gian bước | ${ELAPSED}s |"
            echo "| rustc | \`$RUSTC_V\` |"
            echo "| tauri-cli | \`$TAURI_V\` |"
            echo ""
            echo "> ⚠️ **Đừng đọc số này thành hồi quy so với Story 1.1.** Story 1.1 đo"
            echo "> \`22.944.022 byte\` trên **Intel x86_64**; runner này là **$ARCH**."
            echo "> Baseline khác kiến trúc thì khác dung lượng. Đây cũng là bằng chứng"
            echo "> đầu tiên của dự án trên Apple Silicon (thu hẹp \`deferred-work.md:5\`,"
            echo "> chưa đóng vì chưa ai đo universal binary)."
          } >> "$GITHUB_STEP_SUMMARY"

      # ── AC6 · Task 5 + Task 6 — hai (ba) phép đo `.msi`, GHI Ở MỖI LẦN CHẠY ──────
      #
      # Cả ba bản dựng trong CÙNG MỘT bước, có chủ ý: khâu biên dịch Rust dùng chung,
      # các bản sau chỉ tốn khâu đóng gói. Tách ra job riêng là trả tiền biên dịch nhiều
      # lần cho đúng một số đo (§Ngân sách CI, AC7).
      #
      # ⚠️ Ba lệnh ghi ra CÙNG một đường dẫn `bundle/msi/*.msi`. Mỗi bản được DỌN SANG
      # chỗ khác ngay sau khi dựng, trước khi lệnh sau chạy đè.
      #
      # 🔴 Chiều trừ ĐẢO so với §Công thức đo trên Windows của mũi thăm dò: công thức đó
      # viết cho app thăm dò (mặc định KHÔNG font, bản B chồng thêm). Từ Story 1.2 font
      # NẰM SẴN trong `tauri.conf.json`. Nên: **có font = build thường**, **không font =
      # `--config src-tauri/tauri.nofonts.conf.json`**.
      #
      # 🔴 Và lớp phủ đó dùng `"resources": null`, KHÔNG phải `{}`. Tauri merge theo
      # JSON Merge Patch (RFC 7396): patch là object rỗng ⇒ duyệt 0 khoá ⇒ KHÔNG ĐỔI GÌ.
      # Đã đo thật trên macOS 2026-08-03 bằng ba bản `.app` debug:
      #     không `--config`  → 54.712 KiB, có fonts/
      #     `resources: null` → 28.068 KiB, fonts/ BIẾN MẤT   ✅
      #     `resources: {}`   → 54.712 KiB, fonts/ vẫn còn    ← no-op, y hệt bản đầu
      # `src-tauri/tests/config_invariants.rs` neo lớp phủ đó lại bằng một test.
      - name: đo .msi — có font · không font · runtime nhúng (AC6, NFR6)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msiDir = 'src-tauri\target\release\bundle\msi'
          $hold   = Join-Path $env:RUNNER_TEMP 'msi'
          New-Item -ItemType Directory -Force -Path $hold | Out-Null

          function Build-Msi {
            param([string]$Label, [string[]]$ExtraArgs)
            $sw = [Diagnostics.Stopwatch]::StartNew()
            & npx tauri build --bundles msi @ExtraArgs
            if ($LASTEXITCODE -ne 0) { throw "tauri build ($Label) trả mã $LASTEXITCODE" }
            $sw.Stop()
            $msi = Get-ChildItem "$msiDir\*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $msi) { throw "không tìm thấy .msi sau khi dựng bản '$Label'" }
            $bytes = $msi.Length
            # Dọn đi NGAY — lệnh sau ghi ra đúng đường dẫn này.
            Move-Item $msi.FullName (Join-Path $hold "$Label.msi") -Force
            [pscustomobject]@{ Label = $Label; Bytes = $bytes; Seconds = [int]$sw.Elapsed.TotalSeconds }
          }

          # Bản chính — cấu hình repo NGUYÊN VẸN (`offlineInstaller`, có font).
          $withFonts = Build-Msi -Label 'co-font' -ExtraArgs @()

          # Bản không font — nửa kia của phép trừ đo bộ font.
          $noFonts = Build-Msi -Label 'khong-font' `
            -ExtraArgs @('--config', 'src-tauri/tauri.nofonts.conf.json')

          # Bản downloadBootstrapper — tách dòng "WebView2 Runtime nhúng" BẰNG PHÉP TRỪ
          # thay vì mượn con số ≈127 MB của tài liệu Tauri.
          # `tauri.conf.json` KHÔNG bị sửa: Ice chốt `offlineInstaller` ngày 2026-08-03
          # sau khi cân với lời hứa "fully offline". Lớp phủ này chỉ tồn tại trong lượt đo
          # — nó cố ý KHÔNG được commit, để không ai nhặt nhầm nó thành cấu hình thật.
          $bootstrapCfg = Join-Path $env:RUNNER_TEMP 'bootstrapper.conf.json'
          '{ "bundle": { "windows": { "webviewInstallMode": { "type": "downloadBootstrapper" } } } }' |
            Set-Content -Path $bootstrapCfg -Encoding utf8
          $noRuntime = Build-Msi -Label 'downloadBootstrapper' -ExtraArgs @('--config', $bootstrapCfg)

          # ⚠️ ĐỌC TRƯỚC KHI TIN BA CON SỐ NÀY — cả ba là HIỆU SỐ CỦA KHO NÉN, không phải
          # dung lượng thành phần. MSI nén theo cabinet TOÀN CỤC: bỏ ~27 MB font không
          # làm cabinet nhỏ đi đúng 27 MB, và bỏ WebView2 runtime còn đổi luôn tỉ lệ nén
          # của phần còn lại. Chúng đủ tốt để bắt hồi quy (so lượt này với lượt trước),
          # KHÔNG đủ để khẳng định "bộ font nặng đúng X".
          $fontBytes    = $withFonts.Bytes - $noFonts.Bytes
          $runtimeBytes = $withFonts.Bytes - $noRuntime.Bytes
          # ⚠️ Đây là một ĐỒNG NHẤT THỨC, không phải phép đo thứ ba: thay $runtimeBytes
          # vào thì nó rút gọn đúng bằng $noRuntime.Bytes — tức dung lượng bản
          # `downloadBootstrapper`, vẫn còn stub bootstrapper bên trong. Giữ phép trừ ở
          # dạng này cho khớp bảng hai dòng của NFR6, nhưng ĐỪNG đọc nó thành "mã + font":
          # nó là "toàn bộ .msi TRỪ phần runtime nhúng", một PROXY cho payload.
          $payloadBytes = $withFonts.Bytes - $runtimeBytes
          $mib = { param($b) [math]::Round($b / 1MB, 2) }
          $mb  = { param($b) [math]::Round($b / 1000000, 2) }

          # ── Cổng hỏng-im-lặng ───────────────────────────────────────────────────
          # Chênh lệch 0 KHÔNG phải một số đo — nó là dấu hiệu lớp phủ `--config` không
          # có hiệu lực, và đó đúng là hình dạng "CI xanh với số vô nghĩa" mà cả AC6 tồn
          # tại để chặn. Đỏ ở đây, đừng ghi ra một con số không có thật.
          if ($fontBytes -le 0) {
            throw "Chênh lệch font = $fontBytes byte. Lớp phủ tauri.nofonts.conf.json KHÔNG có hiệu lực. Kiểm tra ``bundle.resources`` có đúng là ``null`` (KHÔNG phải ``{}``) — RFC 7396: patch là object rỗng thì duyệt 0 khoá và không đổi gì."
          }
          if ($runtimeBytes -le 0) {
            throw "Chênh lệch WebView2 = $runtimeBytes byte. Lớp phủ downloadBootstrapper KHÔNG có hiệu lực; dòng 'runtime nhúng' sẽ là số bịa."
          }

          # Dải ước của mũi thăm dò Story 1.1: 16,0–20,3 MiB. Rơi ngoài dải là PHÁT HIỆN
          # đáng ghi, KHÔNG phải lỗi build — cơ chế vẫn chạy đúng, chỉ là số khác dự đoán.
          $fontMiB = & $mib $fontBytes
          $inBand  = ($fontMiB -ge 16.0) -and ($fontMiB -le 20.3)
          if ($inBand) {
            $bandNote = "✅ trong dải ước **16,0–20,3 MiB**"
          } else {
            $bandNote = "⚠️ **NGOÀI dải ước 16,0–20,3 MiB** — phát hiện đáng ghi. Xem lại mức nén CAB mà Tauri đặt cho WiX (``MSZIP`` vs ``LZX``), thứ chưa xác minh được từ macOS."
          }

          # Chế độ WebView2 đọc từ CHÍNH cấu hình trong repo, không chép từ tài liệu.
          $conf = Get-Content 'src-tauri\tauri.conf.json' -Raw | ConvertFrom-Json
          $wvMode = $conf.bundle.windows.webviewInstallMode.type

          # Cùng lý do như bên macOS: gọi `$(…)` thẳng trong chuỗi thì lệnh con gãy chỉ
          # để lại một ô rỗng, không làm bước đỏ. Bắt trước, để trống là đỏ.
          $rustcV = (rustc --version)
          $tauriV = (npx tauri --version)
          if (-not $rustcV -or -not $tauriV) { throw "không đọc được phiên bản toolchain — số đo không truy nguyên được thì không phải số đo" }

          $payloadMB = & $mb $payloadBytes
          if ($payloadMB -gt 200) {
            $ceilingNote = "🔴 **VƯỢT trần** — đây là thay đổi tầng PRD, **cần Ice quyết**."
          } elseif ($payloadMB -ge 150) {
            $ceilingNote = "⚠️ trong dải trần 150–200 MB, dư địa đang mỏng."
          } else {
            $ceilingNote = "✅ dưới trần 150–200 MB."
          }

          # ⚠️ Mảng chuỗi, KHÔNG here-string. Terminator `"@` của PowerShell bắt buộc nằm ở
          # cột 0, còn block scalar của YAML thì kết thúc ngay khi gặp một dòng dedent —
          # hai luật đó loại trừ nhau, và hệ quả là tệp workflow không parse được.
          $summary = @(
            "### Windows — ba phép đo ``.msi`` (AC6 · NFR6)"
            ""
            "| | |"
            "|---|---|"
            "| runner | ``${{ matrix.os }}`` |"
            "| chế độ WebView2 **đang dùng thật** | **``$wvMode``** *(đọc từ chính ``tauri.conf.json``, không chép từ tài liệu)* |"
            "| rustc | ``$rustcV`` |"
            "| tauri-cli | ``$tauriV`` |"
            ""
            "| Bản dựng | byte | MiB | thời gian |"
            "|---|---:|---:|---:|"
            "| có font *(bản chính)* | $($withFonts.Bytes) | $(& $mib $withFonts.Bytes) | $($withFonts.Seconds)s |"
            "| không font | $($noFonts.Bytes) | $(& $mib $noFonts.Bytes) | $($noFonts.Seconds)s |"
            "| ``downloadBootstrapper`` | $($noRuntime.Bytes) | $(& $mib $noRuntime.Bytes) | $($noRuntime.Seconds)s |"
            ""
            "**Bộ font = $fontBytes byte = $fontMiB MiB** — $bandNote"
            ""
            "#### NFR6 — hai dòng nghiệm thu *(Ice nới trần 2026-08-03)*"
            ""
            "| Dòng | byte | MB | Đối chiếu trần 150–200 MB? |"
            "|---|---:|---:|---|"
            "| **Payload sản phẩm** *(= toàn bộ ``.msi`` TRỪ runtime nhúng — proxy, xem ghi chú dưới; dữ liệu từ điển cộng vào ở Story 1.9)* | $payloadBytes | $payloadMB | **CÓ** — $ceilingNote |"
            "| **WebView2 Runtime nhúng** *(tách bằng PHÉP TRỪ, không mượn số ≈127 MB của tài liệu)* | $runtimeBytes | $(& $mb $runtimeBytes) | **KHÔNG** — nằm ngoài ngân sách theo NFR6 đã sửa |"
            ""
            "> ⚠️ **Ba con số trên là hiệu số của kho nén, không phải dung lượng thành phần.**"
            "> ``.msi`` nén theo cabinet **toàn cục**: bỏ bộ font không làm cabinet nhỏ đi đúng"
            "> bằng bộ font, và bỏ runtime còn đổi tỉ lệ nén của phần còn lại. Dòng *Payload*"
            "> rút gọn đúng bằng dung lượng bản ``downloadBootstrapper`` (vẫn còn stub"
            "> bootstrapper trong đó), nên nó là **proxy** cho payload chứ không phải \"mã + font\"."
            "> Dùng để **bắt hồi quy giữa các lượt**; đừng dùng để khẳng định một thành phần nặng bao nhiêu."
            "> *(Từ lượt rà soát 2026-08-03, ``bundle.resources`` còn mang thêm ``license/COPYING.txt``"
            "> ≈ 35 KB — nó nằm trong phần bị lớp phủ ``nofonts`` gỡ, nên có mặt trong ``\$fontBytes``.)*"
            ""
            "> **Số tổng người dùng thật tải về: $($withFonts.Bytes) byte = $(& $mb $withFonts.Bytes) MB.**"
            "> Hai dòng trên là cách *ta* hạch toán; người tải về chỉ thấy con số này, và sau"
            "> Story 1.9 nó còn cộng thêm ~130 MB dữ liệu từ điển. Nếu nó thành rào cản tải"
            "> xuống thì đường quay lui còn mở ở **Story 10.2** — ``downloadBootstrapper`` (mất"
            "> mệnh đề cài offline) hoặc **NSIS** thay ``.msi`` (chạm ``deferred-work.md:6``)."
            "> Không tự chọn ở story này."
            ""
            "> **Đừng đổi ``webviewInstallMode`` để số đẹp lại.** Nhiệm vụ của story này là"
            "> ĐO và BÁO CÁO. Ice đã chốt ``offlineInstaller`` ngày 2026-08-03 sau khi cân với"
            "> lời hứa *fully offline*."
          )
          $summary -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # ══════════════════════════════════════════════════════════════════════════════
      #  HAI PHÉP KIỂM CẦN WEBVIEW — CỐ Ý ĐỨNG CUỐI, SAU MỌI PHÉP ĐO
      #
      #  🔴 Vì sao thứ tự này là bắt buộc, không phải sở thích: cả hai bước dưới đây mở
      #  một cửa sổ thật trên runner, và §Rủi ro đã biết #1 của Story 1.3 nói thẳng rằng
      #  đường đó **chưa ai trong dự án này đo**. Ở bản trước, bước AC8 đứng NGAY TRƯỚC
      #  hai bước build/đo, không có `continue-on-error` — mà mặc định của GitHub Actions
      #  là bước sau chỉ chạy khi bước trước `success()`. Nghĩa là kịch bản dễ xảy ra
      #  nhất ở lượt chạy đầu (webview không mở được ⇒ script hết giờ ⇒ exit 1) sẽ làm
      #  job dừng và **KHÔNG một byte `.msi` nào được đo** — vô hiệu hoá đúng AC6, cái AC
      #  mà cả story này tồn tại để đóng, và AC6 đòi ghi số ở **MỖI** lần CI chạy.
      #
      #  Đừng chuyển hai bước này lên trước hai bước đo. Nếu cần chúng chạy kể cả khi
      #  một bước trước đỏ thì thêm `if: '!cancelled()'`, ĐỪNG đổi thứ tự.
      # ══════════════════════════════════════════════════════════════════════════════

      # ── AC8 — Kiểm 3 NGOÀI chế độ dev, trên cả hai nền tảng ─────────────────────
      #
      # Đóng `deferred-work.md:13` (tổ hợp CSP + asset protocol chưa phép kiểm nào chạm
      # tới). Script tự dựng `tauri build --debug` rồi chạy nhị phân với timeout cứng và
      # đọc dòng `VERDICT:` — xem doc-comment của `scripts/check-scope-bundled.mjs`.
      #
      # ⚠️ Bước này biên dịch profile `dev`, còn hai bước build trên biên dịch `release`.
      # Hai profile KHÔNG dùng chung artifact, nên đây là hai lượt biên dịch — chi phí
      # thật lên AC7, đặc biệt trên macOS (hệ số ×10). `rust-cache` giữ cả hai, nên giá
      # này chỉ đắt ở lượt cache lạnh. ĐO SỐ THẬT rồi hãy bàn cắt gì.
      #
      # Nếu webview không mở được trên runner (không phiên đồ hoạ, WebView2 vắng mặt,
      # treo): script hết giờ và exit 1 kèm lý do. Theo mệnh đề cuối AC8, đó là lúc GHI
      # RÕ và trả lại cho Ice — không đánh dấu đạt, không lặng lẽ bỏ qua bước này.
      - name: check scope ngoài chế độ dev (AC8 — CSP + asset protocol)
        run: npm run check:scope:bundled

      # ── Kiểm 3 CHIỀU ÂM — chế độ dev, nơi duy nhất đọc được HTTP 403 ────────────
      #
      # 🔴 Vì sao bước này phải tồn tại (Ice chốt 2026-08-03, lượt rà soát Story 1.3):
      # bước AC8 ở trên chạy ở chế độ **bundled**, nơi CSP chặn `connect-src` nên chiều
      # ÂM trả `[----] unmeasured` (`src/selftest/scopeCheck.ts`), và `unmeasured`
      # **KHÔNG làm đỏ verdict** — có chủ ý, nhưng hệ quả là: nếu không có bước này thì
      # ai đó nới `assetProtocol.scope` thành `["**"]` lúc chạy, CI vẫn XANH ở mọi bước.
      # `cargo test` bắt được thay đổi **cấu hình**, nhưng nó không chứng minh **hàng rào
      # lúc chạy** — đúng thứ Story 1.2 dựng self-check để chứng minh.
      #
      # Chế độ dev là nơi DUY NHẤT `fetch` chạm thẳng asset protocol và đọc được mã HTTP
      # thật, nên chỉ ở đây mới phân biệt được **403 (scope chặn)** với **404 (thiếu tệp)**.
      #
      # ⚠️ Nó cần một phiên đồ hoạ (`tauri dev`) và có thể trượt trên runner. Nếu trượt:
      # ĐỪNG gỡ bước này. Lượt chạy đó chính là bằng chứng để ghi rõ lý do và trả lại
      # cho Ice theo mệnh đề cuối AC8 — không đánh dấu đạt, không lặng lẽ bỏ.
      - name: check scope chiều âm (chế độ dev — 403 thật)
        run: npm run check:scope

      # KHÔNG upload `.msi`/`.dmg` lên đâu cả ở story này.
      #  - Lên GitHub Release / kèm checksum ⇒ đó là FR107, Story 10.1 (AC5).
      #  - Lên `actions/upload-artifact` thì AC5 cho phép (artifact của lượt chạy, không
      #    phải bản phát hành) — nhưng repo là PRIVATE và bản `.msi` ≈ 150 MB *mỗi lần
      #    push*. Đó là hoá đơn lưu trữ đổi lấy một tệp gần như không ai mở, trong khi
      #    AC7 đang đếm từng phút. Con số — thứ story này thật sự cần — đã nằm ở
      #    `$GITHUB_STEP_SUMMARY`, đọc được mà không phải mở log.
      #  Cần tệp thật để soi tay? Thêm một bước `upload-artifact` TẠM rồi gỡ đi.

      # ── Công thức quan sát mạng (AC5 của Story 1.2) — CHÚ THÍCH, không phải một bước ──
      #
      #   PID=$(pgrep -x auratranslate | tail -n1)
      #   lsof -nP -a -p "$PID" -iTCP -iUDP
      #
      # Story 1.2 bàn giao bản ĐÃ SỬA này để nó không thất truyền, KHÔNG phải để chạy mỗi
      # push. Hai lý do, cả hai đã đo:
      #  1. Nó cần một phiên chạy THẬT có tương tác — một tiến trình vừa khởi động rồi
      #     thoát ngay không nói được gì về việc ứng dụng có ra mạng hay không.
      #  2. Thiếu cờ `-a` thì `lsof -p PID -iTCP -iUDP` là phép HOẶC, không phải VÀ: lượt
      #     đo đầu của Story 1.2 cho ra **274 socket, 234 "ra ngoài"** — của Lark,
      #     AnyDesk, `ssh`, Affinity. Và `pgrep -n AuraTranslate` trả RỖNG: tên tiến
      #     trình lấy từ `package.name` của Cargo (`auratranslate` chữ thường), không từ
      #     `productName`.
      # Đưa nó vào CI dạng một bước là dựng một cổng báo động giả — CI đỏ vĩnh viễn vì lý
      # do không liên quan tới commit, và ai cũng học cách bỏ qua màu đỏ. Đó là cách hỏng
      # đắt hơn hẳn việc không có phép kiểm.

