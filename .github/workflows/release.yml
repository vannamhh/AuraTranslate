# Public release build (FR107, AD-25): a `v*` tag builds the universal macOS .dmg and the
# Windows .msi with the four dictionary files from dict-manifest.toml inside, then the
# `publish` job creates the GitHub Release (Latest) once ci.yml is green on the same commit,
# with the SHA-256 of both installers in the release body and as SHA256SUMS.txt.
# A workflow_dispatch run only builds and inspects. Dictionary tags (`dict-v*`) never match
# `v*`, so they start no run.
#
# Actions are pinned to commit SHAs resolved with `gh api`:
#   checkout v7.0.1 · setup-node v7.0.0 · rust-cache v2.9.1 · upload-artifact v7.0.2
#   download-artifact v8.0.1 · dtolnay/rust-toolchain branch 1.97.1
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: tag matches the app version
        if: github.ref_type == 'tag'
        shell: bash
        run: node scripts/check-release-version.mjs "$GITHUB_REF_NAME"

      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
        with:
          toolchain: 1.97.1
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri

      - name: npm ci
        run: npm ci

      # Exits non-zero on a hash mismatch or a failed download, before any build step, and
      # never leaves an unverified file under src-tauri/resources/dict/.
      - name: fetch dictionaries (sha256 against dict-manifest.toml)
        run: node scripts/fetch-dicts.mjs

      - name: tauri build (macOS universal .dmg)
        if: runner.os == 'macOS'
        shell: bash
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg --config src-tauri/tauri.release.conf.json

      - name: tauri build (Windows .msi)
        if: runner.os == 'Windows'
        shell: pwsh
        run: npx tauri build --bundles msi --config src-tauri/tauri.release.conf.json

      - name: inspect the bundle (dictionary files, fonts and NFR6 sizes)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          BUNDLE=src-tauri/target/universal-apple-darwin/release/bundle
          APPS=("$BUNDLE"/macos/*.app)
          DMGS=("$BUNDLE"/dmg/*.dmg)
          if [ ${#APPS[@]} -ne 1 ] || [ ${#DMGS[@]} -ne 1 ]; then
            echo "expected exactly one .app and one .dmg, found ${#APPS[@]} and ${#DMGS[@]}" >&2
            exit 1
          fi
          BINS=("${APPS[0]}"/Contents/MacOS/*)
          if [ ${#BINS[@]} -lt 1 ]; then
            echo "no binary under ${APPS[0]}/Contents/MacOS" >&2
            exit 1
          fi
          for bin in "${BINS[@]}"; do
            ARCHS=" $(lipo -archs "$bin") "
            echo "$bin: $ARCHS"
            case "$ARCHS" in *" x86_64 "*) ;; *) echo "$bin lacks x86_64" >&2; exit 1 ;; esac
            case "$ARCHS" in *" arm64 "*) ;; *) echo "$bin lacks arm64" >&2; exit 1 ;; esac
          done
          node scripts/inspect-release.mjs --root "${APPS[0]}" --installer "${DMGS[0]}" > "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: inspect the bundle (dictionary files, fonts and NFR6 sizes)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msis = @(Get-ChildItem 'src-tauri\target\release\bundle\msi\*.msi')
          if ($msis.Count -ne 1) { throw "expected exactly one .msi, found $($msis.Count)" }
          $target = Join-Path $env:RUNNER_TEMP 'msi-extract'
          $msiPath = $msis[0].FullName
          $proc = Start-Process msiexec.exe -ArgumentList '/a', "`"$msiPath`"", '/qn', "TARGETDIR=`"$target`"" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "msiexec /a exited with $($proc.ExitCode)" }
          $report = Join-Path $env:RUNNER_TEMP 'report.md'
          node scripts/inspect-release.mjs --root $target --installer $msiPath | Out-File -FilePath $report -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "inspect-release exited with $LASTEXITCODE" }
          Get-Content $report | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'macOS'
        with:
          name: aura-translate-${{ runner.os }}
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Windows'
        with:
          name: aura-translate-${{ runner.os }}
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish GitHub Release
    needs: build
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: ci.yml is green on this commit
        run: |
          set -euo pipefail
          RUNS=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --json databaseId,status,conclusion,event,url --limit 20)
          echo "ci.yml runs on $GITHUB_SHA: $RUNS"
          if [ "$(echo "$RUNS" | jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length')" -lt 1 ]; then
            echo "no successful ci.yml run on $GITHUB_SHA; refusing to publish" >&2
            exit 1
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: aura-translate-*
          merge-multiple: true
          path: release-files

      - name: create the release
        run: |
          set -euo pipefail
          DMGS=(release-files/*.dmg)
          MSIS=(release-files/*.msi)
          if [ ${#DMGS[@]} -ne 1 ] || [ ${#MSIS[@]} -ne 1 ] || [ ! -f "${DMGS[0]}" ] || [ ! -f "${MSIS[0]}" ]; then
            echo "expected exactly one .dmg and one .msi in release-files" >&2
            ls -l release-files >&2
            exit 1
          fi
          node scripts/release-checksums.mjs --notes .github/release-notes.md --out-dir "$RUNNER_TEMP/release" "${DMGS[0]}" "${MSIS[0]}"
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release/release-body.md" "${DMGS[0]}" "${MSIS[0]}" "$RUNNER_TEMP/release/SHA256SUMS.txt"
