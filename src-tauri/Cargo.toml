[package]
name = "auratranslate"
version = "0.1.0"
description = "AuraTranslate — dictionary lookup and translation workspace, fully offline"
authors = ["AuraTranslate"]
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"

# Bố cục `lib.rs` (crate root, giữ `pub fn run()`) + `main.rs` (chỉ gọi `run()`) là
# quy ước của chính framework Tauri v2. Nó là điều kiện để `tests/` `use` được mã
# sản phẩm. ⚠️ Khai `[lib]` mà không có `src/lib.rs` thì `cargo metadata` gãy trước
# cả khi biên dịch (bẫy #2 của Story 1.1) — tệp đã tạo trước khối này.
[lib]
name = "auratranslate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# ⚠️ Ghim bằng `=`, không bằng cú pháp mặc định của Cargo. `"2.6.3"` trong Cargo NGHĨA
# LÀ `^2.6.3` — một dải rộng, đúng thứ Task 6 cấm (*"ghim chính xác, không dùng dải
# rộng"*). Lock giữ đúng số cho tới lần `cargo update` đầu tiên; `=` thì giữ mãi, và
# giữ manifest khớp với bảng Stack thay vì chỉ Cargo.lock khớp.
tauri-build = { version = "=2.6.3", features = [] }

# ── Bảng Stack, ghim CHÍNH XÁC (Ice chốt 2026-08-03: cài trọn bảng ở commit đầu) ──
# Phần lớn crate dưới đây chưa có mã nào gọi tới. Đó là chủ ý: bảng Stack trở thành
# thứ `Cargo.lock` xác nhận, không phải một danh sách trong tài liệu mà mỗi story
# diễn giải lại. Module sở hữu từng crate ghi trong doc-comment của module đó.
[dependencies]
# feature `protocol-asset` BẮT BUỘC khi bật `assetProtocol` — nó là cơ chế cưỡng chế
# duy nhất của AC3 (bẫy #4 của Story 1.1).
tauri = { version = "=2.11.5", features = ["protocol-asset"] }
# Số chính xác đọc từ Cargo.lock 2026-08-03, khớp bảng Stack sau Task 7.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# feature `bundled` biên dịch SQLite từ nguồn C — lần build đầu chậm hơn hẳn.
rusqlite = { version = "=0.40.1", features = ["bundled"] }
# Phụ thuộc bắc cầu của `rusqlite`; khai tường minh để lock ghim đúng số bảng Stack.
libsqlite3-sys = "=0.38.1"
jieba-rs = "=0.10.3"          # core::matching — nhánh tiếng Trung (AD-17)
tantivy-stemmers = "=0.4.0"   # core::matching — nhánh tiếng Anh (AD-17)
docx-rs = "=0.4.22"           # core::export (AD-38)
# TRỰC TIẾP, không qua `tauri-plugin-keyring` (AD-29). core::ai / Story 4.3.
# Feature mặc định `v1` đã kéo sẵn backend gốc của cả ba nền tảng
# (`apple-native-keyring-store/keychain` · `windows-native-keyring-store` ·
# `zbus-secret-service-keyring-store`) — kiểm bằng cách đọc `[features]` của chính
# crate, 2026-08-03. Nghĩa là KHÔNG cần khai feature tay, và cũng KHÔNG có nguy cơ
# rơi vào kho giả. Story 4.3 chỉ cần dùng; nếu đổi feature thì đọc lại chỗ này trước.
keyring = "=4.1.6"
# core::ai (điểm ra mạng 1) và core::webimport::Fetcher (điểm ra mạng 3), AD-15.
# Chưa có một dòng mã nào gọi tới ở story này — xem Completion Notes về AC5.
reqwest = "=0.13.4"
# core::store::schema (work.id UUID v4, AD-28). Story 1.15: đã có BẮC CẦU qua `tauri`
# (Cargo.lock trước story này đã khoá `uuid 1.24.0`), nên khai tường minh ở đây thêm
# ĐÚNG 0 byte payload vào cây. Ghim bằng `=`, không bằng cú pháp mặc định của Cargo —
# `"1.24.0"` trần nghĩa là `^1.24.0`. Rà NFR15 (MIT OR Apache-2.0, đọc trong nguồn đã
# tải) ghi ở story `1-15…md` §Debug Log References.
uuid = { version = "=1.24.0", features = ["v4"] }

# ── Bộ lái cửa sổ Tauri THẬT — Ice chốt 2026-08-11 ──────────────────────────────────
#
# Máy chủ W3C WebDriver nhúng, chạy TRONG webview thật của sản phẩm: WKWebView trên
# macOS, WebView2 trên Windows. Đây là điều kiện để nghiệm thu được lớp lỗi mà một bộ
# chạy trong Chrome KHÔNG chạm tới — khuyết tật hạng cao nhất của lượt code review Story
# 1.21 là *"WKWebView không đặt tiêu điểm cho `<button>`"*, và Chrome không tái lập nó.
#
# 🔴 `optional = true` + feature KHÔNG bật mặc định, và đó KHÔNG phải một sở thích.
# `#[cfg(debug_assertions)]` chỉ loại **mã**; một phụ thuộc Cargo vẫn nằm trong cây và
# trong nhị phân phát hành. Đo trước khi chốt hình dạng này: plugin kéo `axum` + `tokio`
# — tức một máy chủ HTTP — cộng `objc2-web-kit` (macOS) và `webview2-com` (Windows).
# Một máy chủ HTTP trong bản người dùng cài là đúng thứ AD-15 tồn tại để đếm, và AD-15
# chỉ khai BA điểm RA mạng, không khai điểm nào LẮNG NGHE.
#
# ⇒ Cưỡng chế bằng feature, và `check-deps.mjs` khẳng định `axum` và chính plugin
# **VẮNG MẶT** khỏi `cargo tree` mặc định. Không có phép kiểm đó thì mệnh đề "không lọt
# vào bản phát hành" chỉ là một lời hứa trong chú thích.
#
# ⚠️ Danh sách canh KHÔNG gồm `tokio`: đo được nó đã nằm trong cây mặc định từ trước qua
# `tauri` (`tokio v1.53.1`). Canh nó là dựng một cổng đỏ oan ngay ở lượt chạy đầu.
# Số đo hai bộ feature, `cargo tree --locked -e normal`: mặc định **831** dòng, không
# `axum`, không plugin · `--features wdio` **948** dòng, có cả hai.
#
# Chạy e2e:  npm run test:e2e   (nó tự truyền `--features wdio`)
tauri-plugin-wdio-webdriver = { version = "=1.3.0", optional = true }

# `similar` vs `dissimilar`: hàng Deferred của ARCHITECTURE-SPINE, chốt ở Giai đoạn 5
# (Story 8.1) sau khi thử cả hai trên bản review thật. Cài một trong hai hôm nay là
# âm thầm đóng một quyết định kiến trúc đang mở. Số đã kiểm 2026-08-03 nếu 8.1 cần:
# `similar` 3.1.1 · `dissimilar` 1.0.11.

# ── Feature ─────────────────────────────────────────────────────────────────────────
#
# 🔴 KHÔNG có `default = [...]`, và đừng thêm. Bộ feature mặc định rỗng là thứ giữ cho
# `cargo tree` — tức cả `check-deps.mjs` lẫn mọi lượt `tauri build` — không bao giờ thấy
# `axum`/`tokio`. Thêm `wdio` vào `default` là mở lại đúng cái cửa mà khối chú thích ở
# `[dependencies]` vừa đóng, và không cổng nào ngoài `check-deps` sẽ đỏ.
[features]
wdio = ["dep:tauri-plugin-wdio-webdriver"]

# Giữ nguyên profile mà Story 1.1 đã đo dung lượng `.dmg` trên đó — đổi ở đây là làm
# số đo NFR6 của Story 1.1 hết so sánh được.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
