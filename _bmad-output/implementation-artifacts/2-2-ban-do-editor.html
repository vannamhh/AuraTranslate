<script type="module">
// ══════════════════════════════════════════════════════════════════════════════════
// BẢN CHÉP của `src/panels/editorSegments.ts` + `src/panels/editorGutter.ts`.
// Giữ khớp khi sửa — xem giới hạn ① ở đầu tệp.
// ══════════════════════════════════════════════════════════════════════════════════
const SEGMENT_ID_ATTR = 'data-segment-id'
const SEGMENT_RULE_VALUES = ['confirmed', 'primary', 'tm-rule', 'none', 'ornament']

function resolveSegmentRule(i) {
  if (i.retiredAt !== null) return 'ornament'
  if (i.hasCaret) return 'primary'
  if (i.isConfirmed) return 'confirmed'
  if (i.isTmFilled) return 'tm-rule'
  return 'none'
}
const ruleClassOf = (r) => (r === 'none' ? null : `rule-${r}`)

function measureGutterRules(gutter, doc, wanted) {
  const origin = gutter.getBoundingClientRect().top
  const out = []
  for (const el of doc.querySelectorAll(`[${SEGMENT_ID_ATTR}]`)) {
    const id = Number(el.getAttribute(SEGMENT_ID_ATTR))
    if (!Number.isFinite(id) || !wanted.has(id)) continue
    const rects = el.getClientRects()
    if (rects.length === 0) continue
    let top = Infinity
    let bottom = -Infinity
    for (const r of rects) {
      if (r.height <= 0) continue
      if (r.top < top) top = r.top
      if (r.bottom > bottom) bottom = r.bottom
    }
    if (!Number.isFinite(top) || !Number.isFinite(bottom)) continue
    out.push({ id, top: top - origin, height: bottom - top })
  }
  return out
}

// ── Fixture: một Chương ngắn, `target_text` THẬT, cả năm giá trị vạch ───────────────
// ⚠️ Cùng năm câu với ca `a_chapter_with_real_translations_round_trips_through_the_load_command`
//    ở `src-tauri/tests/segment_contract.rs` — hai bàn đo, một fixture.
const FIXTURE = [
  { id: 1, target_text: 'Hắn đẩy cánh cửa ấy ra, bước vào giữa bóng tối dày đặc của gian phòng đã bỏ hoang từ lâu lắm rồi.', is_paragraph_end: false, retired_at: null, isConfirmed: true,  isTmFilled: false },
  { id: 2, target_text: 'Gió thổi tới từ cuối hành lang, mang theo mùi gỉ sắt và một thứ gì đó ẩm ướt hơn thế.', is_paragraph_end: true,  retired_at: null, isConfirmed: false, isTmFilled: false },
  { id: 3, target_text: 'Thiếu niên không quay đầu lại.', is_paragraph_end: false, retired_at: null, isConfirmed: false, isTmFilled: true  },
  { id: 4, target_text: '', is_paragraph_end: false, retired_at: null, isConfirmed: false, isTmFilled: false },
  { id: 5, target_text: 'Câu này đã về hưu sau một lượt gộp — lịch sử của nó vẫn tra lại được.', is_paragraph_end: false, retired_at: '2026-08-12T00:00:00.000Z', isConfirmed: false, isTmFilled: false },
  // 🔴 CÂU 6 — THÊM Ở CODE REVIEW 2026-08-12, và nó tồn tại để PHƠI một khe hở, không để
  // nghiệm thu một giá trị. Ca: *đã dịch bằng tay, chưa xác nhận, con trỏ ở chỗ khác*. Nó
  // không ứng với giá trị nào trong năm, nên `resolveSegmentRule` cho `'none'` ⇒ câu này có
  // bản dịch mà **nhìn y hệt câu 4 chưa dịch**. Khe hở đã ghi ở `editorSegments.ts:95-106` và
  // §Quyết định #4, chủ là Story 2.5.
  // ⚠️ Vì sao KHÔNG dời `CARET_ID` sang câu 4 thay vì thêm câu này: câu 4 rỗng, và một `<span>`
  // rỗng không có hình chữ nhật nào — vạch `primary` sẽ mất chỗ đo. Thêm ở CUỐI cũng giữ
  // nguyên hình học của năm câu trên, nên mọi số đã ghi ở §Debug Log vẫn đọc được.
  { id: 6, target_text: 'Câu này đã có bản dịch nhưng chưa ai xác nhận — và nó KHÔNG có vạch.', is_paragraph_end: false, retired_at: null, isConfirmed: false, isTmFilled: false },
]
// Câu 4 CỐ Ý rỗng: nó là nhánh *không vạch* (chưa dịch) — nghiệm thu rằng nó KHÔNG có vạch.
// `primary` đến từ caret, nên nó được đặt vào câu 2 bằng `data-caret` ngay dưới.
const CARET_ID = 2

function render(doc, rows) {
  doc.textContent = ''
  for (const s of rows) {
    const span = document.createElement('span')
    span.className = 'sent'
    span.setAttribute(SEGMENT_ID_ATTR, String(s.id))
    if (s.id === CARET_ID) span.setAttribute('data-caret', '')
    span.textContent = s.target_text
    doc.append(span)
    if (s.is_paragraph_end) doc.append(document.createElement('br'))
  }
}

function paint(gutter, doc, rows, caretId) {
  const classes = new Map()
  for (const s of rows) {
    const cls = ruleClassOf(
      resolveSegmentRule({
        retiredAt: s.retired_at,
        hasCaret: s.id === caretId,
        isConfirmed: s.isConfirmed,
        isTmFilled: s.isTmFilled,
        targetText: s.target_text,
      }),
    )
    if (cls !== null) classes.set(s.id, cls)
  }
  const rules = measureGutterRules(gutter, doc, new Set(classes.keys()))
  gutter.textContent = ''
  for (const r of rules) {
    const el = document.createElement('div')
    el.className = `gmark ${classes.get(r.id)}`
    el.style.top = `${r.top}px`
    el.style.height = `${r.height}px`
    gutter.append(el)
  }
  return rules
}

const g1 = document.getElementById('g1')
const d1 = document.getElementById('d1')
const g2 = document.getElementById('g2')
const d2 = document.getElementById('d2')
const report = document.getElementById('report')

// Bảng ② — trạng thái THẬT hôm nay: cùng năm câu, `target_text` rỗng hết.
const BLANK = FIXTURE.map((s) => ({ ...s, target_text: '', retired_at: null, isConfirmed: false, isTmFilled: false }))

render(d1, FIXTURE)
render(d2, BLANK)

const lines = []
function redraw() {
  const r1 = paint(g1, d1, FIXTURE, CARET_ID)
  const r2 = paint(g2, d2, BLANK, null)
  lines.length = 0
  lines.push(`Engine  : ${navigator.userAgent}`)
  lines.push(`Theme   : ${document.documentElement.dataset.theme}`)
  lines.push('')
  lines.push('① Fixture năm giá trị — vạch ĐO ĐƯỢC (px, trong hệ toạ độ máng):')
  for (const r of r1) {
    const el = d1.querySelector(`[${SEGMENT_ID_ATTR}="${r.id}"]`)
    lines.push(
      `   segment ${r.id}: top=${r.top.toFixed(2)} height=${r.height.toFixed(2)} ` +
        `(${el.getClientRects().length} hình chữ nhật) → ${g1.querySelector(`.gmark:nth-child(${r1.indexOf(r) + 1})`).className}`,
    )
  }
  lines.push(
    `   số vạch vẽ ra: ${r1.length} / ${FIXTURE.length} câu  ← câu 4 (chưa dịch) phải KHÔNG có vạch,` +
      ` và câu 6 (ĐÃ dịch, chưa xác nhận) cũng KHÔNG — đó là KHE HỞ, chủ Story 2.5`,
  )
  lines.push('')
  lines.push(`② Trạng thái thật hôm nay: ${r2.length} vạch trên ${BLANK.length} câu ← phải là 0`)
  report.textContent = lines.join('\n')
}

// Ba nguồn kích hoạt — cùng cơ chế `EditorPanel.vue`.
let handle = null
const schedule = () => {
  if (handle !== null) return
  handle = requestAnimationFrame(() => {
    handle = null
    redraw()
  })
}
new ResizeObserver(schedule).observe(d1)
new ResizeObserver(schedule).observe(d2)
void document.fonts.ready.then(schedule)
schedule()

document.getElementById('theme').addEventListener('click', () => {
  const root = document.documentElement
  root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark'
  schedule()
})

// ── NFR2 (AC14): dựng + đo trên quy mô Chương LỚN NHẤT CÓ THẬT ────────────────────
document.getElementById('nfr2').addEventListener('click', () => {
  const N = 9850
  const host = document.createElement('div')
  host.className = 'doc tok-editor'
  host.style.width = '600px'
  const gut = document.createElement('div')
  gut.className = 'gutter'
  const box = document.createElement('div')
  box.className = 'edbody'
  box.style.height = '400px'
  box.style.width = '640px'
  box.append(gut, host)
  document.body.append(box)

  const rows = []
  for (let i = 1; i <= N; i += 1) {
    rows.push({
      id: i,
      target_text: `Câu số ${i} — một câu tiếng Việt dày dấu, đủ dài để chạy qua ít nhất một lần xuống dòng ở bề rộng này.`,
      is_paragraph_end: i % 9 === 0,
      retired_at: null,
      isConfirmed: false,
      isTmFilled: false,
    })
  }

  const t0 = performance.now()
  render(host, rows)
  void host.offsetHeight // ép layout đồng bộ — không đo một lượt dựng chưa bố cục
  const tRender = performance.now() - t0

  // Ca THẬT hôm nay: đúng MỘT câu có vạch (caret).
  const t1 = performance.now()
  paint(gut, host, rows, 1)
  const tOne = performance.now() - t1

  // Ca TRẦN: cả 9.850 câu đều có vạch — chưa story nào tới được, nhưng nó là số phải biết.
  const all = rows.map((s) => ({ ...s, isConfirmed: true }))
  const t2 = performance.now()
  paint(gut, host, all, null)
  const tAll = performance.now() - t2

  box.remove()
  report.textContent = [
    ...lines,
    '',
    `③ NFR2 trên ${N} câu (trần 50 ms / frame):`,
    `   dựng DOM + bố cục          : ${tRender.toFixed(1)} ms`,
    `   đo + vẽ 1 vạch (ca THẬT)   : ${tOne.toFixed(1)} ms`,
    `   đo + vẽ ${N} vạch (ca TRẦN): ${tAll.toFixed(1)} ms`,
  ].join('\n')
  console.log(`[bàn đo 2.2] render=${tRender.toFixed(1)}ms one=${tOne.toFixed(1)}ms all=${tAll.toFixed(1)}ms`)
})

document.getElementById('which').textContent = `${SEGMENT_RULE_VALUES.length} giá trị vạch đã khai`
</script>
