[[entry]]
id = 1
type = "story"
title = "Tracer: quét chính tả và ngữ pháp một segment, gạch chân ngay trong ô"
description = '''
Đường mỏng nhất xuyên mọi lớp: lệnh đăng ký → command Rust mới (seam mới trong `ai_boundary`) → bộ lắp prompt thuần có bản dịch → `TranslationProvider` → Channel → gạch chân lượn sóng dưới đúng cụm chữ trong ô dịch của segment đang có con trỏ.

- Thấy chạy khi xong: gõ một lỗi chính tả vào một segment, gọi lệnh, thấy gạch chân lượn sóng màu `error` dưới đúng chữ đó.
- Hình dạng phát hiện trên dây do story này chốt, đủ bốn trường của FR83 (loại · vị trí · giải thích ngắn · đề xuất sửa), để 9.4 chỉ làm phần webview và lượt ghi. Phát hiện chỉ sống trong bộ nhớ webview, không ghi `project.db`.
- Seam lệnh mới thêm vào allow-list của `tests/ai_boundary.rs` theo AD-13, lời gọi đi qua `TranslationProvider` theo AD-15.
- Đo cơ chế vẽ: CSS Custom Highlight API trên WKWebView (wavy, offset 4px) vì ô là `contenteditable` mà DOM giữ chữ. Không làm được thì dừng và trình Ice hai phương án (lớp phủ / cách khác) kèm số đo.
- Có huỷ, số token và ước tính chi phí như mọi lời gọi AI, lời mời cấu hình khi chưa cấu hình AI (FR77).

Tiêu chí gốc giữ lại (epics.md 9.1, 9.7):

**Given** bản dịch tiếng Việt của người dùng **When** quét **Then** phát hiện lỗi chính tả và lỗi ngữ pháp
**Given** một phát hiện thuộc loại chính tả hoặc ngữ pháp **When** hiển thị **Then** dùng màu `error` — loại lỗi này **có đáp án đúng**
**Given** lời gọi quét **When** thực hiện **Then** đi qua prompt lắp bởi bộ lắp prompt của `core/ai/rag.rs`, không nối chuỗi tại chỗ gọi
**Given** module thực hiện quét **When** đặt trong cây nguồn **Then** nằm trong `core/ai/` **And** không module nào ngoài `ai/` import nó
**Given** ứng dụng chưa cấu hình AI **When** người dùng gọi proofreader **Then** mời cấu hình **And** mọi năng lực khác vẫn chạy đầy đủ
**Given** proofreader chạy xong **When** kiểm văn bản **Then** **không một ký tự nào** trong bản dịch bị đổi (9.7)
**Given** trạng thái xác nhận của các segment **When** proofreader chạy **Then** không segment nào đổi trạng thái (9.7)
'''
verify = "Trên một segment có lỗi chính tả cố ý, lệnh quét vẽ gạch chân lượn sóng màu `error` dưới đúng cụm chữ, và một test chứng minh lượt quét không đổi ký tự hay trạng thái nào trong `project.db`."
