description = '''
Winston soạn và Ice ký AD-53 trong spine trước khi có đường ghi nào của proofreader.

Câu hỏi AD phải trả lời:
- Chấp nhận một đề xuất sửa (thay một cụm trong bản dịch CỦA NGƯỜI DÙNG) là lượt ghi gì: hàng mới trong bảng AD-47 ③ đóng (qua `write_non_user_target`, xuất xứ nào, mốc so nào) hay lượt sửa của người dùng (đi qua buffer gõ và flush AD-35, xác nhận sẽ phân xử `self`). Khi segment là bản nháp chưa có bản sao, có hỏi lại theo AD-49 (iii) không. Hai phương án hợp lệ ⇒ trình Ice cả hai kèm số đo.
- Chữ ký của một phát hiện để khoá ghi nhớ "không phải lỗi" (FR84): tính từ gì để sống sót qua gộp/tách segment; sửa câu AD-3 (spine :95, "tham chiếu `segment.id`") đang mâu thuẫn với spine :918 và FR84.
- Phát hiện cũ đi thế nào khi người dùng gõ sửa câu sau lượt quét, và lệnh chấp nhận từ chối ra sao khi văn bản đã khác văn bản lúc quét.

Ngoài phạm vi AD này (quyết định 2026-10-10): seam lệnh và cổng provider đã có AD-13/AD-15 trả lời; hình dạng phát hiện trên dây do tracer 9.1 chốt, phát hiện chỉ sống trong bộ nhớ webview.
