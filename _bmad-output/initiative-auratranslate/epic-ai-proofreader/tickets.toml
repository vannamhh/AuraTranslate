[[entry]]
id = 6
type = "story"
title = "Bỏ qua có ghi nhớ"
description = '''
Lưu ghi nhớ "không phải lỗi" trong `project.db` khoá theo chữ ký phát hiện của AD-53, lọc khi quét, có danh sách xem lại và bỏ ghi nhớ; ghi thêm số phát hiện của mỗi lượt quét để 9.8 có mẫu số.

Tiêu chí gốc (epics.md, nguyên văn):

**Given** một phát hiện **When** người dùng đánh dấu *"không phải lỗi"* **Then** lần quét sau **không báo lại phát hiện đó**
**Given** phạm vi ghi nhớ **When** xác định **Then** **trong cùng Tác phẩm**
