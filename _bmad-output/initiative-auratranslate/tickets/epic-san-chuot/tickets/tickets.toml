references = ["architecture-auratranslate/architecture-auratranslate.md §AD-62 mục 3–7"]

[[entry]]
id = 2
type = "story"
title = "Menu chuột phải cho thao tác câu của Lưới"
description = "10 id: `editor.confirm_segment`, `merge_segments`, `split_segment`, `omit_segment`, `restore_segment`, `end_target_paragraph`, `join_target_paragraph`, `next_untranslated`, `clear_source_cuts`, `split_chapter`. Dựng menu câu mở bằng chuột phải qua command mới `editor.sentence_menu.open` và luật nhắm câu ở `ux-san-chuot/EXPERIENCE.md` §Interaction Primitives; các story sau thêm mục vào menu này. Đo trên WKWebView hai điều trang thử chưa đo: chặn `mousedown` phối hợp với nhắm câu, và trả caret khi đóng menu. Mục Tách câu tắt khi điểm cắt thuộc câu khác vì lệnh đọc `sourceCut`, không đọc caret, và AD-5 không cho hoàn tác. Đưa `editorOmitError` và lượt từ chối của `setCurrentSegmentParagraphEnd` ra thanh trạng thái; sửa `panel.grid.regroup_no_cut`; đổi `status.regroup_hint` thành gợi ý chuột phải."
verify = "Trên app thật: caret ở câu A, chuột phải vào câu B ở ô bản dịch, ô nguyên văn và ô số câu, chọn Xác nhận, đúng câu B được xác nhận; đóng menu không chọn gì thì caret về câu A và phím gõ tiếp không đè chữ; điểm cắt ở câu khác thì Tách câu tắt; một spec e2e trên WKWebView khoá đường này; ca (i) cho từng id, mở menu bằng sự kiện `contextmenu` thật chứ không ép trạng thái mở, và `POINTER_DEBT` mất đủ 10 id."
covers = ["R7", "R8", "R9"]
after = [1]
hitl = false
risk = "high"
references = ["tickets/epic-san-chuot/ux-san-chuot/EXPERIENCE.md §Bảng chỗ đặt"]

