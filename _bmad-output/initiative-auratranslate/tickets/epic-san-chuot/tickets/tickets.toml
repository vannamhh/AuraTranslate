[[entry]]
id = 1
type = "story"
title = "Hạ cổng Kiểm M cùng sổ nợ chỉ co lại"
description = "Thêm trường `pointer` vào `CommandSpec` và sửa `frozen()` chép nó; viết khai báo `pointer` ở `src/commands/index.ts`, chốt lại từng id (đo 2026-10-30: 27 id đạt điều kiện máy đọc so với 29 đề xuất ở AD-62 mục 7; `glossary.settings.open` và `export.alignment.prev` nằm trong nợ của Story 14.5 và 14.9 vì không đạt `via`/`aim`, id nào chốt thành `pointer` thì rút khỏi story đó); dựng Kiểm M, sàn quần thể, `POINTER_DEBT` và `POINTER_DEBT_BASELINE`; trình Ice hai cách `via` và `dispatch` + `auto` cho `library.list_works` và `library.list_chapters` kèm số đo; ghi vào `deferred-work.md` mỗi bề mặt một mục với `Chủ: Story 14.N`, một mục `Chủ: Epic 14` cho lượt dùng thật của Ice và một mục `B7` cho hành vi focus của nút trên WebView2; thêm dòng luật ở `src/commands/README.md` và `src/AGENTS.md`. Sáu id ở lại `POINTER_DEBT` dù đích cuối là `pointer`, vì đường chuột của chúng chưa tồn tại: `segment.selection.extend_down`, `segment.selection.extend_up` (Story 14.3), `import.preview.block_next`, `import.preview.block_prev` (Story 14.6), `import.preview.bilingual_caret_left`, `import.preview.bilingual_caret_right` (Story 14.7); story đó khai `pointer` khi dựng xong."
verify = "`npm run check:commands` xanh với Kiểm M chạy thật; đối chứng (a)–(g) mỗi phép gỡ đỏ đúng id, (h) qua self-check; `npm run check:debt-owner` xanh với các mục nợ mới."
