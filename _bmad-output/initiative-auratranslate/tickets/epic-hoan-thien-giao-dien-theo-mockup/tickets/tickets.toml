[[entry]]
id = 33
type = "story"
title = "Hệ điều khiển: phần Workspace còn sót và danh sách canh đủ"
description = "Chuyển trọn các tệp còn lại có nút tự vẽ: `ProofreaderStrip`, `TmFuzzyStrip`, `GlossaryConfirmStrip` (dải gợi ý bậc `sm`), `LookupPanel`, `ReviewMinePanel`, `AiTranslationPanel`, `PanelTab`, `LookupDrawer`, `ReviewDock`, `WorkspaceMode`, `App.vue`, `StatusBar` sang lớp `ui-*` của story 27 theo DESIGN.md §Điều khiển; bỏ khối scoped khai lại chiều cao, viền, hover, focus, dáng khoá. Danh sách của ca vitest canh chuyển đổi thôi là danh sách: ca đọc mọi `.vue` dưới `src/`, mỗi ngoại lệ còn lại có tên và lý do. Ghi một mục nợ `Chủ: Epic 12` cho lượt nhìn app thật."
verify = "`tests/frontend/controls-adoption.test.ts` đọc mọi `.vue` dưới `src/` và xanh, mỗi ngoại lệ còn lại liệt kê trong test kèm lý do; thêm một `<button>` không lớp vào một tệp bất kỳ chưa từng nằm trong danh sách thì đỏ (đối chứng thật); test hiện có của các panel, dải gợi ý và thanh trạng thái vẫn xanh; `check:tokens` và `check:i18n` xanh."
