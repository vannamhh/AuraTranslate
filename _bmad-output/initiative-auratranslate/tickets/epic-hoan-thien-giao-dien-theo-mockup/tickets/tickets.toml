title = "Hệ điều khiển: Cài đặt"
description = "Chuyển trọn `SettingsOverlay` và tám mục `Settings*Section.vue` sang lớp `ui-*` của story 27 theo DESIGN.md §Điều khiển: ô nhập và ô chọn bậc `lg`, chiều rộng theo `ch` (ngắn 8ch cho số và ngưỡng, vừa 24ch, kín hàng), nút Nguy hiểm \"Xoá khoá\" giữ bậc của nó, thanh trượt giữ nguyên; bỏ khối scoped khai lại chiều cao, viền, hover, focus, dáng khoá; thêm chín tệp vào danh sách của ca vitest canh chuyển đổi. Ghi một mục nợ `Chủ: Epic 12` cho lượt nhìn app thật."
verify = "`tests/frontend/controls-adoption.test.ts` xanh với chín tệp mới, và đỏ khi gỡ lớp `ui-*` khỏi nút Lưu khoá của `SettingsOverlay` (đối chứng thật); test hiện có của Cài đặt vẫn xanh, kể cả ca không giật màn khi lưu; `check:tokens` và `check:i18n` xanh."
covers = []
after = [30]
hitl = false
risk = "low"
references = ["ux-auratranslate/DESIGN.md §Điều khiển", "ux-auratranslate/mockups/he-dieu-khien.html", "ux-auratranslate/mockups/settings.html"]

