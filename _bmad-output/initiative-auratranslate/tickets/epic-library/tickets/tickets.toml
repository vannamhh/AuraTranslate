[[entry]]
id = 18
type = "story"
title = "Đặt trạng thái Chương ngay trong Workspace"
description = "Dịch xong một Chương mà không phải quay về Library để báo nó xong (PRD FR5 🔵 2026-10-27, Decision 2026-10-27 của epic). Năm phần: (1) Workspace có nút đặt Chương đang mở thành Đã xong, dùng lệnh `lifecycle.set_chapter_done` đã có ở `src/commands/index.ts`, nút theo hệ nút ba bậc của 12.26; (2) xác nhận câu cuối chưa xác nhận của Chương (không tính `is_omitted`) hiện một gợi ý không chặn \"Đánh dấu Chương Đã xong?\" — chỉ người bấm mới đặt, hệ thống không tự đặt Done; (3) lần đầu một câu của Chương Chưa bắt đầu được lưu bản dịch không rỗng do người dùng (gõ qua flush, nhận bản AI, dịch lô), Chương chuyển Đang dịch trong cùng giao dịch rồi chạy `Indexer::rebuild`; điền sẵn TM không tính; Tạm ngưng và Đã xong không bị đổi; (4) một migration `project.db` tiến một chiều chuyển Chưa bắt đầu → Đang dịch cho Chương có câu không `is_omitted` mang bản dịch không rỗng; (5) gỡ nút \"Đặt Chương này là Đã xong\" ở `src/modes/LibraryWorkPage.vue` cùng khoá i18n `mode.library.set_chapter_done` (giữ lệnh `lifecycle.set_chapter_done`, nút Workspace dùng nó), và sửa hai e2e `story-5-5-progress` và `story-5-12-reading-frontier` — hai spec đặt Đã xong qua cầu IPC trần vì \"Workspace chưa có nút đổi trạng thái Chương\" (ghi chủ Story 5.7, chưa từng vào `deferred-work.md`) — sang bấm nút Workspace. Entry 19 dựa vào trạng thái Đang dịch do phần (3) và (4) đặt. Gợi ý ở phần (2) móc vào lượt xác nhận câu của lưới, cùng vùng mã với 2.14 đang làm: đọc `epic-bien-tap-theo-segment/tickets/bug-doi-con-tro-cham-o-chuong-lon-plan.md` trước khi sửa. Phần (3) không thêm lượt khứ hồi IPC hay lượt đọc trạng thái ngoài giao dịch của flush (AD-35). Chương nhập song ngữ đã khởi tạo Đang dịch (`work_creation.rs`), migration (4) chỉ chạm Chương Chưa bắt đầu."
verify = "`cargo test --test lifecycle_contract` có ca: lượt ghi đầu chuyển Chưa bắt đầu → Đang dịch đúng một lần; Chương Tạm ngưng hoặc Đã xong nhận lượt ghi vẫn giữ trạng thái; điền sẵn TM không đổi trạng thái; migration chuyển Chương có bản dịch và không chạm Chương rỗng hoặc chỉ có câu `is_omitted` — mỗi ca đỏ khi gỡ thật câu `UPDATE` hoặc nhánh tương ứng. Vitest (tệp đặt tên trong plan, chạy bằng `npm run test:story 5-18`): gợi ý hiện khi xác nhận câu cuối chưa xác nhận, không hiện khi còn câu chưa xác nhận. `npm run test:e2e -- --spec e2e/specs/story-5-5-progress.e2e.mjs`: bấm nút Đã xong trong Workspace rồi về Library thấy tiến độ tăng."
covers = ["FR5", "FR6", "FR7"]
after = []
hitl = false
risk = "medium"
