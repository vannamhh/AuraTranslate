[[entry]]
id = 19
type = "story"
title = "Chế độ đọc đọc cả Chương đang dịch và tạm ngưng"
description = "Đọc lại phần đã dịch mà không phải đặt Chương thành Đã xong trước (PRD FR120 🔵 2026-10-27). Dãy đọc đi qua các Chương Đã xong, Đang dịch, Tạm ngưng liên tiếp và dừng ở mốc biên tại Chương Chưa bắt đầu đầu tiên, thay luật dừng ở Chương chưa `Done` đầu tiên trong `src-tauri/src/commands/segment/reading.rs`; trong Chương chưa xong, mỗi dãy câu liền nhau chưa có bản dịch thành một dòng mờ \"… N câu chưa dịch\" dẫn sang Workspace đúng câu đầu dãy, không bao giờ mang nguyên văn; dấu nhẹ câu chưa xác nhận giữ nguyên và áp dụng ở mọi Chương được đọc. Đổi theo cả kiểu `NextNotDone`/\"mọi Chương đều Done\" và doc-comment của `reading.rs`, hình dạng dây `next-not-done` mà `src-tauri/tests/ipc_contract.rs` ghim, và phần dựng trang ở `src/modes/ReadingMode.vue` + `readingState.ts`; trạng thái lạ (ngoài bốn giá trị) vẫn dừng dãy, không đoán. Dựa vào entry 18 đặt Đang dịch ở lần ghi đầu và sửa dữ liệu cũ; thiếu nó, Chương đã dịch vẫn ghi Chưa bắt đầu và dãy đọc dừng ngay."
verify = "`cargo test --test segment_contract` (ca frontier của lệnh đọc) và `cargo test --test ipc_contract` có ca: dãy đi qua Đang dịch và Tạm ngưng, dừng tại Chưa bắt đầu; dãy câu chưa dịch gộp thành một khoảng mang đúng số câu và id câu đầu; câu `is_omitted` không tính vào khoảng; không trường nào mang `source_text` của câu chưa dịch — mỗi ca đỏ khi gỡ thật nhánh tương ứng. E2e `story-5-12-reading-frontier` sửa theo luật mới và xanh."
