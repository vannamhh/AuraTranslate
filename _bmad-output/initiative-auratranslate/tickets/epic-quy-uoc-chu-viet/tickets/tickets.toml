# tickets.toml — epic-quy-uoc-chu-viet. One [[entry]] per story; table order is the build order.

[[entry]]
id = 1
type = "story"
title = "Một luật Global đánh dấu và thay một chỗ trong Chương đang mở"
description = "Tracer bullet. Kho luật tầng Global, bộ khớp ở Rust (NFC chỉ để so, không phân biệt hoa thường, không gộp i/y, ranh giới âm tiết), lệnh quét bản dịch của Chương đang mở trả các khoảng khớp, dấu tại chỗ trong ô bản dịch theo khuôn vẽ của Proofreader, nhận thay một chỗ với kiểu hoa theo chỗ bị thay, đi đúng lượt ghi mà AD mới quy định. Dải `convention` chỉ mở khi bấm dấu hoặc F8; cặp lệnh `marks.next/prev` nhận F8/Shift+F8 cho cả dấu Proofreader lẫn dấu quy ước. Luật không có cụm thay thế chỉ có dấu. Chỗ khớp nằm trọn trong bản dịch của mục Glossary đã chốt mà câu nguồn chứa thuật ngữ thì không có dấu."
verify = "Spec e2e trên WKWebView: thêm luật `đảm bảo → bảo đảm`, mở một Chương có câu `Đảm bảo an toàn.` thì dấu hiện, nhận thay thì ô thành `Bảo đảm an toàn.` và xuất xứ câu không đổi."
covers = ["R1", "R3", "R4", "R5", "R7", "R10", "R12"]
after = []
hitl = false
risk = "high"
references = ["architecture-auratranslate/architecture-auratranslate.md §AD-67 mục 1–8, 11, 12 (a)(b)(h), 12b phần dải và `marks.next/prev`", "ux-auratranslate/EXPERIENCE.md §Quy ước chữ Việt — FR159", "ux-auratranslate/mockups/quy-uoc-chu-viet.html", "architecture-auratranslate/architecture-auratranslate.md §AD-47, §AD-53"]

