title = "Thay cả Chương qua danh sách từng chỗ"
description = "Màn xác nhận liệt kê mọi chỗ khớp của mọi luật đang hiệu lực trong Chương kèm câu chứa nó, lọc được theo luật (mở từ dải thì lọc sẵn theo luật đang xem), chọn sẵn, bỏ chọn được; một lượt thay chạy trên văn bản trước khi thay, chữ vừa thay không bị khớp lại. Câu đã xác nhận giữ xác nhận, cặp TM mang chữ mới, lịch sử phiên bản ghi lại, xuất xứ không đổi; câu đã cắt không có trong danh sách. Đường lui theo AD-49."
verify = "`cargo test` của bộ quét xanh với ca: câu `nhằm bảo đảm bảo vệ` có một chỗ khớp, bỏ chọn chỗ đó thì câu giữ nguyên từng ký tự; câu đã xác nhận sau khi thay vẫn đã xác nhận và cặp TM mang chữ mới."
covers = ["R6", "R7", "R10", "R11"]
after = [1]
hitl = false
risk = "high"
references = ["architecture-auratranslate/architecture-auratranslate.md §AD-67 mục 7, 8, 12 (c)(d)(e), 12b", "ux-auratranslate/EXPERIENCE.md §Quy ước chữ Việt — FR159, KF-5", "ux-auratranslate/mockups/quy-uoc-chu-viet.html"]

