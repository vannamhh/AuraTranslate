<!doctype html>
<meta charset="utf-8">
<title>Đo lưới tổng hợp</title>
<style>
@font-face{font-family:NotoTC;src:url(NotoSerifCJKtc-Regular.otf)}
body{margin:0;font:16px/1.95 NotoTC,serif}
#bar{position:sticky;top:0;z-index:2;background:#ffd;padding:8px;border-bottom:2px solid #aa0;font:14px/1.4 system-ui}
#bar button{font-size:16px;padding:6px 14px;margin-right:6px}
#out{width:100%;height:9em;font:12px monospace}
.grid-block{display:grid;width:1200px;grid-template-columns:3px 30px minmax(0,1fr) minmax(0,1fr);align-items:stretch}
.col{display:grid;grid-template-rows:subgrid;grid-row:1/-1;min-width:0}
.c0{grid-column:1}.c1{grid-column:2}.c2{grid-column:3}.c3{grid-column:4}
.cell{padding:4px 8px;border-bottom:1px solid #ddd;min-width:0}
.cell-tgt{white-space:pre-wrap;contain:layout style}
.hv-parallel{margin:0;white-space:pre-wrap;font-size:18px;line-height:normal}
ruby{ruby-position:under}
rt{padding-inline:2px;padding-block:2px 4px;font-size:16px;line-height:1.95;font-family:serif}
.plain{margin:0;white-space:pre-wrap;font-size:18px;line-height:2.05}
</style>
<div id="bar">
  <div id="where"></div>
  <button data-go="ruby,90">Ruby 90 hàng</button><button data-go="plain,90">Không ruby 90 hàng</button>
  <button data-go="ruby,200">Ruby 200 hàng</button><button data-go="plain,200">Không ruby 200 hàng</button>
  <br><button id="run">Đo trang này (40 lần sửa)</button><button id="runall">Đo cả bốn trang</button>
  <textarea id="out" readonly></textarea>
</div>
<div id="grid"></div>
<script>
const q = new URLSearchParams(location.search);
const kind = q.get('v') || 'ruby', n = Number(q.get('n') || 90);
let seed = 42; const r = () => (seed = (seed * 16807) % 2147483647);
const src = [], tgt = [];
for (let i = 0; i < n; i++) {
  let h = kind === 'ruby' ? '<p class=hv-parallel>' : '<p class=plain>';
  for (let w = 0; w < 18; w++) {
    const ch = String.fromCharCode(0x4e00 + r() % 3000) + String.fromCharCode(0x4e00 + r() % 3000);
    h += kind === 'ruby' ? `<span class=hv-unit><ruby>${ch}<rt>ab cd</rt></ruby></span>` : ch;
  }
  src.push(h + '</p>');
  tgt.push('Bản dịch câu số ' + i + ' đây là một câu tiếng Việt.');
}
document.getElementById('grid').innerHTML = `<div class=grid-block style="grid-template-rows:repeat(${n},auto)">
<div class="col c0">${src.map(() => '<div class=cell></div>').join('')}</div>
<div class="col c1">${src.map((_, i) => `<div class=cell>${i + 1}</div>`).join('')}</div>
<div class="col c2">${src.map(s => `<div class=cell>${s}</div>`).join('')}</div>
<div class="col c3">${tgt.map((t, i) => `<div class="cell cell-tgt" contenteditable role=textbox aria-label="c${i}" id=t${i}>${t}</div>`).join('')}</div></div>`;
const ua = (navigator.userAgent.match(/(Edg|Chrome)\/[\d.]+/g) || []).join(' ');
const fontOk = () => [...document.fonts].map(f => f.status).join(',');
document.getElementById('where').textContent =
  `Trang: ${kind === 'ruby' ? 'Ruby' : 'Không ruby'}, ${n} hàng · ${document.getElementsByTagName('*').length} phần tử · ${ua}`;
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => {
  const [v, m] = b.dataset.go.split(','); location.search = `?v=${v}&n=${m}`;
});
const frame = () => new Promise(res => requestAnimationFrame(() => setTimeout(res, 0)));
async function measure() {
  await document.fonts.ready;
  const cell = document.getElementById('t' + Math.floor(n / 2));
  cell.focus(); getSelection().collapse(cell.firstChild, cell.firstChild.length);
  const d = [];
  for (let i = 0; i < 45; i++) {
    await frame();
    const t0 = performance.now();
    document.execCommand('insertText', false, 'ê');
    document.body.offsetHeight;
    if (i >= 5) d.push(performance.now() - t0);
  }
  d.sort((a, b) => a - b);
  const f = x => x.toFixed(2);
  return `${kind}\t${n}\tmed=${f(d[d.length >> 1])}\tp90=${f(d[Math.floor(d.length * 0.9)])}\tmax=${f(d.at(-1))}\tfont=${fontOk()}\t${ua}`;
}
const out = document.getElementById('out');
document.getElementById('run').onclick = async () => { out.value += (await measure()) + '\n'; out.select(); };
document.getElementById('runall').onclick = () => {
  sessionStorage.setItem('queue', JSON.stringify(['ruby,90', 'plain,90', 'ruby,200', 'plain,200']));
  sessionStorage.setItem('results', '');
  next();
};
function next() {
  const queue = JSON.parse(sessionStorage.getItem('queue') || '[]');
  if (!queue.length) { out.value = sessionStorage.getItem('results'); out.select(); sessionStorage.removeItem('queue'); return; }
  const [v, m] = queue.shift().split(',');
  sessionStorage.setItem('queue', JSON.stringify([v + ',' + m, ...queue]));
  if (kind === v && n === Number(m)) {
    sessionStorage.setItem('queue', JSON.stringify(queue));
    measure().then(line => { sessionStorage.setItem('results', sessionStorage.getItem('results') + line + '\n'); next(); });
  } else location.search = `?v=${v}&n=${m}`;
}
if (sessionStorage.getItem('queue')) setTimeout(next, 300);
</script>
