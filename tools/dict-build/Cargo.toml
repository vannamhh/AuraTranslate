# 🔴 Workspace RỖNG — đây là workspace root CỦA CHÍNH NÓ, không phải thành viên
# của workspace nào khác. Đây là toàn bộ AC4 ở tầng cấu trúc (§Quyết định #1 · §Bẫy 2
# của Story 1.9): cây phụ thuộc của `src-tauri` và cây phụ thuộc của build tool này
# không giao nhau về mặt vật lý — có `Cargo.lock` riêng, feature unification riêng.
# ⛔ Không xoá khối này. ⛔ Không thêm `[workspace]` ở gốc repo mà quên loại trừ
# `tools/dict-build` — làm vậy sẽ hút build tool vào cây phụ thuộc sản phẩm mà không
# lỗi nào được ném.
[workspace]

[package]
name = "dict-build"
version = "0.1.0"
description = "Build tool nội bộ: gộp năm nguồn từ điển thô thành dict-core.db. KHÔNG vào bản phát hành (AD-25)."
edition = "2024"
# Khớp toolchain CI (`rust-version` của `src-tauri/Cargo.toml` là 1.85, cũ hơn CI thật —
# xem `deferred-work.md:83`). Build tool này khai đúng số CI dùng, không chép số cũ đó.
rust-version = "1.97.1"
publish = false

# ⛔ Không ghim bằng `=` như `src-tauri/Cargo.toml`. Đây không phải bảng Stack của sản
# phẩm — AD-25 nói giấy phép/phiên bản parser không ràng buộc sản phẩm, nên dải mặc định
# của Cargo (`"x.y.z"` = `^x.y.z`) là đủ. Giấy phép từng crate ghi ở README.md cạnh đây.
[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

# Bố cục lib.rs + main.rs — xem doc-comment `src/lib.rs`.
[lib]
name = "dict_build"
path = "src/lib.rs"

[[bin]]
name = "dict-build"
path = "src/main.rs"
