# dict-manifest.toml — AD-25
#
# Dữ liệu từ điển là **artifact có phiên bản và checksum**, không phải nội dung repo.
# File `.db` phát hành qua GitHub Release ("dict-vN") và tải về theo bảng dưới đây;
# `.gitignore` giữ chúng ra ngoài git bằng dòng `*.db`.
#
# Mỗi mục PHẢI có đủ ba trường:
#
#   url             = "https://github.com/…/releases/download/dict-vN/<tên>.db"
#   sha256          = "<64 ký tự hex>"   # đối chiếu sau khi tải, trước khi dùng
#   source_version  = "…"                # phiên bản NGUỒN THÔ đã sinh ra file này
#                                        # (không phải phiên bản của file .db)
#
# Không điền giá trị giả để "cho có". Một checksum sai trong manifest hỏng im lặng
# đúng kiểu tệ nhất: file tải về vẫn dùng được, chỉ là không ai biết nó là bản nào.
#
# Lớp nền và mỗi lớp gỡ rời là MỘT file `.db` độc lập (AD-10) → mỗi lớp một mục.
#
# Gỡ một lớp gỡ rời (FR112): chuyển khối `[[detachable]]` của lớp đó thành khối dưới đây,
# xoá `.db` cục bộ, không đổi mã — quy trình ở `DATA-REMOVAL.md`. Khối không có `url`/`sha256`.
# Hôm nay chưa có mục nào.
#
#   [[removed]]
#   name   = "<mã lớp trong DETACHABLE_ALL>"
#   reason = "<vì sao gỡ>"
#   date   = "<YYYY-MM-DD>"
#
# **Story sở hữu nội dung: 1.9** (sinh dữ liệu) và **10.1** (đưa vào bản phát hành).
# Story 1.2 chỉ dựng khung này.

[base]
# Release `dict-v3` chứa đủ bốn tệp dưới đây; `scripts/fetch-dicts.mjs` tải chúng và đối
# chiếu `sha256` trước khi `release.yml` dựng bản cài. `dict-v3` khác `dict-v2` đúng một tệp,
# `dict-tran-van-chanh.db` (nghĩa tách theo số khoanh ①②③); ba tệp còn lại giữ nguyên byte.
# `dict-v1` chỉ có ba tệp, sha khác bảng này, nên không còn được trỏ tới.
#
# 🔴 SHA-256 CẬP NHẬT LẦN BA ở **Story 1.10c** (2026-08-06) — LƯỢC ĐỒ LÊN v2 + NGUỒN NỀN
# THỨ BẢY. `SCHEMA_VERSION` 1→2 (cột `dict_entry.nom_reading` mới, AC6) buộc dựng lại
# **cả bốn** tệp bằng `--layer all` — kể cả `dict-thieu-chuu.db`/`dict-vietphrase.db` dù
# nguồn thô của chúng KHÔNG đổi (lược đồ đổi ⇒ nhị phân đổi, đúng bài học `--layer all`
# đã ghi ở trên). `dict-core.db` thêm nguồn nền thứ bảy `en-wiktionary-vi` (2.232 đầu
# mục — âm Hán Việt/Nôm gắn nhãn, Quyết định #3a: KHÔNG dict_sense) và `unihan` đổi vai
# (`kVietnamese` → `nom_reading`, AC1 — không mất dữ liệu, xem story §Debug Log).
#   • dict-core.db:        194.998.272 → **195.813.376 byte** (+815.104)
#   • dict-thieu-chuu.db:    5.787.648 →   **5.795.840 byte** (+8.192, thêm cột NULL)
#   • dict-vietphrase.db:  160.083.968 → **160.788.480 byte** (+704.512, thêm cột NULL)
#   • `built_at` của dict-core.db đổi (`2026-08-06T08:38:53Z`) vì `raw/en_wiktionary_vi/`
#     mới có mtime mới nhất; `built_at` của thieu-chuu/vietphrase GIỮ NGUYÊN
#     (`2026-08-04T23:53:16Z` — nguồn thô của chúng không đổi, chỉ lược đồ đổi).
#     `builder_version` 0.3.0 → 0.4.0.
#
# 🔴 SHA-256 CẬP NHẬT LẦN BỐN ở **code review Story 1.19** (2026-08-10) — LƯỢC ĐỒ LÊN v3.
# `SCHEMA_VERSION` 2→3: cột `dict_source.lang` mới, **ĐO** từ `dict_entry` của chính tệp
# (`insert.rs::backfill_source_langs`) chứ không khai tay. Buộc dựng lại **cả bốn** tệp,
# cùng lý do lượt 1.10c: lược đồ đổi ⇒ nhị phân đổi. Cột này tồn tại để AC6 hỏi được
# *"mọi nguồn CỦA ĐƯỜNG ĐANG TRA đều tắt chưa"* thay vì hỏi toàn tập — xem
# `core/dict/mod.rs::SourceAttribution::lang`.
#   • Đo được: 10/10 nguồn cho đúng MỘT `lang` (`viwiktionary-en` là `en`, chín nguồn còn
#     lại là `zh`), khớp chính xác lượt đo tay 2026-08-10 trước khi dựng.
#   • Giá đọc: **~480 ms → ~16 ms** mỗi lượt khởi động. Dẫn xuất lúc đọc bằng
#     `SELECT DISTINCT` tốn 374 ms trên `dict-core.db` (594.770 hàng) + 97 ms trên
#     `dict-vietphrase.db` (679.302 hàng) vì `dict_entry` không có index trên `source_id`.
#   • Kích thước **KHÔNG đổi** ở cả bốn tệp — cột TEXT ngắn trên đúng 10 hàng nằm lọt
#     trong trang đã cấp phát.
#
# 🔴 SHA-256 CẬP NHẬT LẦN NĂM ở **tra nhanh Mod+K** (2026-11-14) — LƯỢC ĐỒ LÊN v4 (AD-69).
# `SCHEMA_VERSION` 3→4: cột `dict_entry.reading_key` + `idx_entry_reading_key` và cột
# `dict_source.gloss_lang`. Dựng lại **cả bốn** tệp bằng `--layer all`; URL trỏ release
# `dict-v4`, mà Ice chưa tải lên — tới lúc đó `scripts/fetch-dicts.mjs` không tải được.
#   • dict-core.db:         195.813.376 → **208.252.928 byte**
#   • dict-thieu-chuu.db:     5.795.840 →   **5.894.144 byte**
#   • dict-vietphrase.db:   160.788.480 → **167.567.360 byte**
#   • dict-tran-van-chanh.db: 10.842.112 → **11.960.320 byte**
#   • Tổng bốn tệp 393.674.752 byte (bản cài chưa đo).
#   • 70 hàng của dict-core.db có `reading` mà `reading_key` NULL (Quảng/phương ngữ, dấu
#     kết hợp NFD); `tests/reading_key_real_data.rs` kê số đó.
#
# ✅ Tái lập: bốn SHA-256 dưới đây là của MỘT lượt dựng 2026-11-14; chưa chạy lượt thứ hai
