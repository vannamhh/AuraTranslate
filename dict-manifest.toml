#
# 🔴 SHA-256 CẬP NHẬT ở Story 1.10 (2026-08-05): lượt chạy Task 10 dùng `--layer all`
# (mặc định), nên nó dựng lại CẢ BA tệp — kể cả dict-core.db, và `insert_meta` dùng chung
# thêm một HÀNG `dict_meta('layer','base')` vào đó. 0 dòng đổi ở schema.rs/năm parser nền,
# nhưng tệp NHỊ PHÂN vẫn khác ⇒ giữ số cũ sẽ là một checksum SAI cho tệp thật sẽ lên
# release. Ice chốt sau lượt code review: giữ tệp mới + checksum mới.
# ⚠️ Đính chính: `--layer thieu-chuu`/`--layer vietphrase` chạy ĐƠN LẺ được và ⛔ không
# chạm base — nên việc dựng lại là hệ quả của LỆNH đã chạy, ⛔ không phải bất khả kháng.
#
# 🔴 CHECKSUM Ở ĐÂY GIỜ TÁI LẬP ĐƯỢC (AD-25, sửa sau lượt code review): `dict_meta
# ('built_at')` không còn lấy từ `strftime('now')` — nó dẫn xuất từ CHÍNH nguồn thô
# (`SOURCE_DATE_EPOCH`, hoặc mtime mới nhất trong `raw/`). Cùng một cây nguồn thô ⇒ cùng
# một tệp `.db` byte-for-byte ⇒ cùng SHA-256. Trước đó, hai lượt build liên tiếp từ cùng
# một cây fixture ra hai hash khác nhau, tức mọi số dưới đây chỉ đúng cho ĐÚNG MỘT lượt
# chạy và ⛔ không cổng nào bắt được sai lệch.
# ✅ BA SỐ DƯỚI ĐÂY đến từ lượt dựng lại 2026-08-05T09:33 SAU khi vá — cùng lượt chạy
# `--layer all` sinh ra cả ba tệp, `built_at = 2026-08-04T23:53:16Z` (dẫn xuất từ mtime
# nguồn thô, giống nhau ở cả ba). Dựng lại từ cùng cây `raw/` ⇒ ra ĐÚNG ba số này.
# Xác nhận: `dict-thieu-chuu.db` cho cùng hash qua ba lượt dựng vào ba thư mục đích khác
# nhau. Từ đây, `cargo run` lại ⛔ không còn làm hỏng manifest.
